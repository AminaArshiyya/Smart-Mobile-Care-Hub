<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Mobile Care Hub - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh; 

            display: flex;
            justify-content: center;
            align-items: center;

            background-image:
                linear-gradient(
                    rgba(5, 20, 45, 0.62),
                    rgba(5, 20, 45, 0.62)
                ),
                url("images/mobile.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* LOGIN CONTAINER */

        .login-container {
            width: 480px;
            max-width: 92%;

            padding: 42px 45px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            text-align: center;
        }


        /* HEADING */

        h1 {
            color: #062b5c;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .tagline {
            color: #666;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* INPUT */

        .input-box {
            width: 100%;

            text-align: left;

            margin-bottom: 18px;
        }


        .input-box label {
            display: block;

            color: #062b5c;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .input-box input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #ccd5e0;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }


        .input-box input:focus {

            border-color: #062b5c;

            box-shadow:
                0 0 5px rgba(6, 43, 92, 0.20);
        }


        /* BUTTONS */

        .button-section {

            display: flex;

            gap: 15px;

            margin-top: 5px;
        }


        .login-btn {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #062b5c;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-btn:hover {

            background: #0a3d7d;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(6, 43, 92, 0.25);
        }


        /* FOOTER */

        .footer {

            margin-top: 24px;

            color: #777;

            font-size: 12px;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {

                padding: 32px 25px;
            }

            h1 {

                font-size: 25px;
            }

            .button-section {

                flex-direction: column;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- HEADING -->

        <h1>
            Smart Mobile Care Hub
        </h1>


        <p class="tagline">
            All Services in One Place
        </p>


        <!-- USERNAME -->

        <div class="input-box">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-box">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

        </div>


        <!-- BUTTONS -->

        <div class="button-section">


            <!-- USER LOGIN -->

            <button
                type="button"
                class="login-btn"
                onclick="userLogin()">

                User Login

            </button>


            <!-- ADMIN LOGIN -->

            <button
                type="button"
                class="login-btn"
                onclick="adminLogin()">

                Admin Login

            </button>


        </div>


        <div class="footer">

            Smart Mobile Care Hub © 2026

        </div>


    </div>


    <script>

        // =========================================
        // USER LOGIN
        // =========================================

        function userLogin() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();


            if (username === "" || password === "") {

                alert("Please enter username and password.");

                return;
            }


            // Save user login
            localStorage.setItem(
                "loggedInUser",
                username
            );

            localStorage.setItem(
                "userType",
                "user"
            );


            // Go to User Dashboard
            window.location.href =
                "./user-dashboard.html";
        }


        // =========================================
        // ADMIN LOGIN
        // =========================================

        function adminLogin() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();


            if (username === "" || password === "") {

                alert("Please enter username and password.");

                return;
            }


            // Save admin login
            localStorage.setItem(
                "loggedInUser",
                username
            );

            localStorage.setItem(
                "userType",
                "admin"
            );


            // Go to Admin Dashboard
            window.location.href =
                "./admin-dashboard.html";
        }

    </script>


</body>
</html>
